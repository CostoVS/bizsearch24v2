services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizsearch24-web
    restart: always
    ports:
      - "3005:3000"
    depends_on:
      - db
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://user:password@db:5432/db
    volumes:
      - ./data:/app/.data

  db:
    image: postgres:15-alpine
    container_name: bizsearch24v2-db-1
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
